<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b110e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GameKnight" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>GameKnight — Football Prediction Exchange</title>
    <meta name="description" content="Trade YES/NO shares on football results, goals and title races. Prices are probabilities set by fans." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #0b110e; color: #eef3ef; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      a { color: inherit; text-decoration: none; }
      button, input, select { font: inherit; color: inherit; }
      input:focus, select:focus, button:focus-visible { outline: 2px solid #c6f432; outline-offset: 1px; }
      input[type=number]::-webkit-inner-spin-button { opacity: .4; }
      ::selection { background: #c6f43255; }
      @keyframes gk-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes gk-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" style="min-height:100vh;display:grid;place-items:center;color:#7d8f84;font:600 15px Inter,system-ui,sans-serif;text-align:center;padding:24px"><div><div style="font-size:56px;color:#c6f432;line-height:1">♞</div><div style="margin-top:12px">Warming up the pitch…</div></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
